name: Deploy to GitHub Pages

# Builds the site and publishes dist/ to the gh-pages branch. GitHub
# automatically enables Pages for a repository when a gh-pages branch
# first appears, so no manual Settings step is needed.
#
# This is the only workflow that writes to gh-pages. To roll the live site
# back to the frozen pre-universe-map snapshot, run this workflow by hand
# against `snapshot/pre-universe-map-2026-08-21` — that branch carries its
# own copy of this file, so it deploys itself with no reconstruction. See
# the "Rolling back" section of the README for the permanent version.
on:
  push:
    branches: [main, claude/eshkere-org-website-84n8s3]
  # Hourly re-sync of the Notion "Current" source, off the hour to avoid the
  # top-of-hour queue. Scheduled runs always use the repository's default
  # branch — so whatever the default branch holds is what the live site keeps
  # being rebuilt from, every hour, whether or not anyone pushes.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Overwrites src/data/current-source.generated.json from Notion. Fails
      # the job — leaving the live site untouched — unless exactly one Source
      # has Current checked with a valid http(s) URL.
      - name: Sync current source from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: npm run sync:source
      - run: npm run build
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
