name: Deploy to GitHub Pages

# Builds the site and publishes dist/ to the gh-pages branch. GitHub
# automatically enables Pages for a repository when a gh-pages branch
# first appears, so no manual Settings step is needed.
on:
  push:
    branches: [main, claude/eshkere-org-website-84n8s3]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
